<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projets réalisés par Daris Boumertit – développeur full stack."
    />
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="../style/projets.css" />
    <title>Projets — Daris</title>
  </head>
  <body>
    <div
      id="divMenuBurger"
      role="dialog"
      aria-modal="true"
      aria-label="Navigation mobile"
    >
      <nav class="divMenu">
        <img
          class="imgHautMenu"
          src="../assets/imgHautMenuBurger.svg"
          alt=""
          aria-hidden="true"
        />
        <div class="divPage">
          <a class="lienPages" href="../index.html">Accueil</a>
        </div>
        <div class="divPage">
          <a class="lienPages" href="./competences.html">Compétences</a>
        </div>
        <div class="divPage">
          <img
            class="imgSelect"
            src="../assets/imgSelectMenuBurger.svg"
            alt=""
            aria-hidden="true"
          />
          <a class="lienPages lienChoisis" href="./projets.html">Projets</a>
          <img
            class="imgSelectReverse imgSelect"
            src="../assets/imgSelectMenuBurger.svg"
            alt=""
            aria-hidden="true"
          />
        </div>
        <div class="divPage">
          <a class="lienPages" href="./aPropos.html">À Propos</a>
        </div>
        <div class="divPage">
          <a class="lienPages" href="./contact.html">Contact</a>
        </div>
        <img
          class="imgBasMenu"
          src="../assets/imgBasMenuBurger.svg"
          alt=""
          aria-hidden="true"
        />
      </nav>
    </div>

    <header>
      <div>
        <a href="../index.html" aria-label="Accueil"
          ><img src="../assets/logo.svg" alt="Logo"
        /></a>
        <h1>Projets</h1>
      </div>
      <nav aria-label="Navigation principale">
        <ul>
          <li><a href="../index.html">Accueil</a></li>
          <li><a href="./competences.html">Compétences</a></li>
          <li class="page"><a href="./projets.html">Projets</a></li>
          <li><a href="./aPropos.html">À Propos</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
      <nav class="navMenuBurger" aria-label="Menu mobile">
        <button
          id="btnMenuBurger"
          aria-expanded="false"
          aria-controls="divMenuBurger"
        >
          <img src="../assets/menuBurger.svg" alt="Ouvrir le menu" />
        </button>
      </nav>
    </header>

    <main>
      <!-- Carrousel desktop (rempli dynamiquement par JS) -->
      <article class="articleProjet" aria-live="polite" aria-label="Projet en cours"></article>

      <!-- Liste mobile statique -->
      <article class="articleProjetMobile" aria-label="Liste des projets"></article>
    </main>

    <footer class="footerAll">
      <div class="divEnnemis" aria-hidden="true">
        <img class="imgGaucheEnnemi" src="../assets/ennemi5.svg" alt="" />
        <img class="imgDroiteEnnemi" src="../assets/ennemi6.svg" alt="" />
      </div>
      <div class="footerPortfolio">
        <img src="../assets/logo.svg" alt="Logo" />
        <p>Portfolio</p>
      </div>
      <div class="footerLink">
        <a
          href="https://github.com/DarisB1"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          ><img src="../assets/github.svg" alt="GitHub"
        /></a>
        <a
          href="https://www.linkedin.com/in/daris-boumertit-39269b313/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          ><img src="../assets/linkedIn.svg" alt="LinkedIn"
        /></a>
      </div>
    </footer>

    <script type="module" src="../script/script.js"></script>
  </body>
</html>
